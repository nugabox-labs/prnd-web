name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prnd-web-deploy
  cancel-in-progress: false

env:
  # 정적 사이트 — 웹 서버가 이 폴더를 그대로 https://prnd.nugabox.com 으로 서비스한다.
  DEPLOY_DIR: /volume1/Develop/webapps/prnd-web

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, nugacloud]
    steps:
      - name: 이전 배포 커밋 조회
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          if [[ -f .last_deploy_commit ]]; then
            echo "PREV_DEPLOY_SHA=$(cat .last_deploy_commit)" >> "$GITHUB_ENV"
          else
            echo "PREV_DEPLOY_SHA=" >> "$GITHUB_ENV"
          fi

      - name: 저장소 갱신 (fetch + reset --hard)
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -c safe.directory="$DEPLOY_DIR" fetch "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" main
          git -c safe.directory="$DEPLOY_DIR" reset --hard FETCH_HEAD

      - name: 이번 배포 커밋 기록
        working-directory: ${{ env.DEPLOY_DIR }}
        run: git -c safe.directory="$DEPLOY_DIR" rev-parse HEAD > .last_deploy_commit

      - name: 진단 정보 수집 (실패 시)
        if: failure()
        working-directory: ${{ env.DEPLOY_DIR }}
        run: git -c safe.directory="$DEPLOY_DIR" status --short > /tmp/prnd-web-deploy-diag.txt 2>&1 || true

      - name: Mattermost 알림
        if: always()
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREV_DEPLOY_SHA: ${{ env.PREV_DEPLOY_SHA }}
          SITE_URL: https://prnd.nugabox.com
          DIAG_FILE: /tmp/prnd-web-deploy-diag.txt
        run: |
          # 첫 배포가 fetch 단계에서 실패하면 스크립트가 아직 없을 수 있다.
          if [[ -f .github/mattermost_notify.py ]]; then
            python3 .github/mattermost_notify.py
          else
            echo "알림 스크립트 없음 — 생략"
          fi
